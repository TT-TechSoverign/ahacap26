[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "Affordable Home A/C API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiohttp>=3.13.3",
    "aiosmtplib>=3.0.1",
    "tenacity>=8.2.0",
    "pypdf>=6.6.0",
    "urllib3>=2.6.3",
    "redis>=5.0.1",
    "stripe>=8.1.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.0.0",
    "sentry-sdk[fastapi]>=1.40.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["."]
