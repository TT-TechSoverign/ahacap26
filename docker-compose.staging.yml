services:
  staging-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: staging-web
    ports:
      - "3002:3000"
    restart: always
    env_file:
      - .env.staging
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_INTERNAL_URL=http://staging-api:8000
    volumes:
      - ./apps/web/lib/content:/app/apps/web/lib/content:ro
      - ./apps/web/storage/staging:/app/apps/web/storage
      - ./apps/web/public:/app/apps/web/public:ro
    depends_on:
      staging-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  staging-api:
    build:
      context: ./apps/api
    container_name: staging-api
    ports:
      - "8002:8000"
    restart: always
    env_file:
      - .env.staging
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@staging-db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://staging-redis:6379
      - CHAOS_MODE=False
    volumes:
      - ./apps/api/content:/app/content:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips "*"
    depends_on:
      staging-db:
        condition: service_healthy
      staging-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  staging-db:
    image: postgres:16-alpine
    container_name: staging-db
    ports:
      - "5434:5432"
    restart: always
    env_file:
      - .env.staging
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ahac_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  staging-redis:
    image: redis:alpine
    container_name: staging-redis
    restart: always
    ports:
      - "6381:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  staging_postgres_data:
